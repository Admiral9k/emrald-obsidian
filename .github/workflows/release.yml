name: Release with Attestation

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build
        run: node esbuild.config.mjs production

      - name: Attest main.js
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: main.js

      - name: Attest styles.css
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: styles.css

      - name: Resolve release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -f "RELEASE-NOTES-${VERSION}.md" ]; then
            echo "path=RELEASE-NOTES-${VERSION}.md" >> "$GITHUB_OUTPUT"
          else
            echo "No RELEASE-NOTES-${VERSION}.md found; failing so releases are never published without a description." >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            main.js
            manifest.json
            styles.css
