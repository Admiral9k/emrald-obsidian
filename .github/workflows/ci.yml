name: CI

# Build, lint and every harness in scripts/ on each push and pull request (the release workflow only runs on tags).
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (tsc + esbuild)
        run: npm run build

      - name: Lint
        run: npx eslint src main.ts

      - name: Harnesses
        run: npm test
